<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard administrativo | Thindesk</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css">
    <script defer th:src="@{/js/dashboard.js}"></script>
</head>
<body class="bg-light">
<main class="container py-4" th:attr="data-api=@{/api/dashboard}">
    <a th:href="@{/}">Voltar ao início</a>
    <h1 class="my-3">Dashboard administrativo</h1>
    <form class="row g-3 mb-4">
        <label class="col-sm">Conclusão a partir de<input name="inicio" type="date" class="form-control"></label>
        <label class="col-sm">Conclusão até<input name="fim" type="date" class="form-control"></label>
        <label class="col-sm">Status<select name="status" class="form-select"><option value="">Todos</option></select></label>
        <label class="col-sm">Tipo<select name="tipo" class="form-select"><option value="">Todos</option></select></label>
        <label class="col-sm">Técnico<select name="tecnico" class="form-select"><option value="">Todos</option></select></label>
        <div class="col-12">
            <button class="btn btn-primary">Consultar / atualizar</button>
            <button type="reset" class="btn btn-outline-secondary">Limpar</button>
        </div>
    </form>
    <p id="feedback" role="status" aria-live="polite"></p>
    <div id="resultados" hidden>
        <div class="row g-3 mb-4">
            <section class="col-md"><div class="card card-body"><h2 class="h6">Total de chamados</h2><strong id="total" class="fs-2"></strong></div></section>
            <section class="col-md"><div class="card card-body"><h2 class="h6">Chamados atendidos</h2><strong id="atendidos" class="fs-2"></strong></div></section>
            <section class="col-md"><div class="card card-body"><h2 class="h6">Atendidos sem data</h2><strong id="atendidosSemData" class="fs-2"></strong></div></section>
        </div>
        <div class="row g-3">
            <section class="col-lg-6"><div class="card card-body"><h2 class="h5">Atendidos por dia</h2><ul id="dias" class="list-unstyled mb-0"></ul></div></section>
            <section class="col-lg-6"><div class="card card-body"><h2 class="h5">Situação dos chamados</h2><ul id="situacoes" class="list-unstyled mb-0"></ul></div></section>
            <section class="col-12"><div class="card card-body"><h2 class="h5">Tipos mais atendidos</h2><ol id="tipos" class="mb-0"></ol></div></section>
        </div>
    </div>
</main>
</body>
</html>
